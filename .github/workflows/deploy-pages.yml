name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/dj-spotify-mixing-platform-ifv6ec]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Publishing to a gh-pages branch auto-enables GitHub Pages for the
      # repo — the Pages REST API isn't accessible to the workflow token.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
